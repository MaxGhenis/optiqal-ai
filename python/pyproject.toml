[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optiqal"
version = "0.1.0"
description = "QALY estimation for lifestyle interventions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Max Ghenis" }
]
keywords = ["qaly", "health", "monte-carlo", "lifestyle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.scripts]
optiqal-pan-ukb = "optiqal.validation.pan_ukb:main"

[project.optional-dependencies]
validation = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = ["optiqal[validation,dev]"]

[project.urls]
Homepage = "https://optiqal.ai"
Repository = "https://github.com/PolicyEngine/optiqal-ai"

[tool.hatch.build.targets.wheel]
packages = ["optiqal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Production-scale runs. They are part of the default suite, since the slowest one
# adds about nine seconds; deselect them with `pytest -m "not slow"`.
markers = [
    "slow: runs at production draw counts rather than a reduced test count",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# The formatter owns code line length. Remaining long lines are string
# literals (evidence citations, rationale text) that wrapping would reword.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
