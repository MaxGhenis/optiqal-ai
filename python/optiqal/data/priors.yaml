evidence_adjustments:
  meta-analysis: {alpha_multiplier: 1.1, source: "Evidence type adjustment: multiplier on alpha."}
  rct: {alpha_multiplier: 1.5, source: "Evidence type adjustment: multiplier on alpha."}
  cohort: {alpha_multiplier: 0.8, source: "Evidence type adjustment: multiplier on alpha."}
  case-control: {alpha_multiplier: 0.7, source: "Evidence type adjustment: multiplier on alpha."}
  review: {alpha_multiplier: 1.0, source: "Evidence type adjustment: multiplier on alpha."}
  other: {alpha_multiplier: 0.9, source: "Evidence type adjustment: multiplier on alpha."}

study_quality_shrinkage:
  rct_preregistered_hard_endpoint:
    retention: 0.90
    source: >-
      Tiered publication-bias shrinkage by study quality. Empirical anchor:
      RCT + preregistered + hard endpoint has small residual inflation (winner's curse, ~10%).
      Examples: PCPT finasteride, CTT statin meta, SELECT semaglutide, ASPREE aspirin, EMPA-REG.
  rct_standard:
    retention: 0.80
    source: >-
      RCT standard: some publication/selective-reporting bias (~20%).
      Examples: BP RCTs, sleep-RCT onset latency, PREDIMED.
  mendelian_randomization:
    retention: 0.80
    source: "Copied from rct_standard, the closest existing design tier (PR D, 2026-09-04)."
  meta_analysis_rcts:
    retention: 0.80
    source: "Meta-analysis of RCTs: ~20% publication bias, partly corrected via trim-and-fill."
  cohort_meta_analysis:
    retention: 0.70
    source: "Copied from cohort_large, the closest existing design tier (PR D, 2026-09-04)."
  cohort_large:
    retention: 0.70
    source: "Cohort: ~30% publication bias (Ioannidis 2008 baseline)."
  cohort_small:
    retention: 0.65
    source: "Cohort: ~30% publication bias (Ioannidis 2008 baseline)."
  case_control:
    retention: 0.60
    source: "Case-control: ~40% publication bias (recall/selection bias)."
  supplement_industry_rct:
    retention: 0.50
    source: >-
      Supplement-industry RCT: ~50% publication bias (unregistered, short duration,
      surrogate endpoints, sponsor bias). Examples: NR, NMN, ashwagandha commercial RCTs.
  observational_speculative:
    retention: 0.45
    source: "Observational speculative / ecological: ~55% publication bias."
  animal_or_mechanistic:
    retention: 0.30
    source: "Animal-only or mechanistic: ~70% translation penalty plus publication bias."

qol_transport:
  study_quality_shrinkage:
    rct_objective_endpoint:
      retention: 0.90
      source: >-
        Reporting/publication shrinkage for symptom endpoints. Same shape as the mortality
        table; the weak tiers are harsher because subjective endpoints are easier to p-hack
        and selectively report than hard endpoints.
    meta_analysis_placebo_rcts:
      retention: 0.85
      source: >-
        Reporting/publication retention for symptom endpoints. The weak tiers are harsher because
        subjective endpoints are easier to p-hack and selectively report than hard endpoints.
    rct_placebo_patient_reported:
      retention: 0.80
      source: >-
        Reporting/publication retention for symptom endpoints. The weak tiers are harsher because
        subjective endpoints are easier to p-hack and selectively report than hard endpoints.
    rct_open_label:
      retention: 0.60
      source: >-
        Reporting/publication retention for symptom endpoints. The weak tiers are harsher because
        subjective endpoints are easier to p-hack and selectively report than hard endpoints.
    supplement_industry_rct:
      retention: 0.50
      source: >-
        Reporting/publication retention for symptom endpoints. The weak tiers are harsher because
        subjective endpoints are easier to p-hack and selectively report than hard endpoints.
    observational_symptom:
      retention: 0.45
      source: >-
        Reporting/publication retention for symptom endpoints. The weak tiers are harsher because
        subjective endpoints are easier to p-hack and selectively report than hard endpoints.
    mechanistic_or_self_experiment:
      retention: 0.30
      source: >-
        Reporting/publication retention for symptom endpoints. The weak tiers are harsher because
        subjective endpoints are easier to p-hack and selectively report than hard endpoints.

  categories:
    sleep_symptom:
      alpha: 2.4
      beta: 5.6
      source: >-
        Transport priors are the fraction of a published or claimed effect expected to
        survive placebo stripping plus population transport. They reuse ConfoundingPrior
        purely for its Beta mechanics (mean, confidence interval, and sampling).
      rationale: >-
        Placebo response averages ~64% of drug response for subjective insomnia outcomes
        (Winkler & Rief 2015); objective deltas are far smaller than felt ones.
        Beta(2.4, 5.6) -> mean 30%.
      calibration_sources:
        - Winkler & Rief 2015 (placebo response in insomnia trials)
        - Ferracioli-Oda 2013 (melatonin objective latency)
    respiratory_airway:
      alpha: 4.5
      beta: 4.5
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        Airway interventions mix objective mechanics (AHI, resistance) with subjective
        sleepiness; sham-controlled CPAP trials show real but roughly halved subjective
        gains vs open-label. Beta(4.5, 4.5) -> mean 50%.
      calibration_sources:
        - Jenkinson 1999 (sham-controlled CPAP)
        - Kiely 2004 (nasal steroid in snorers)
    sexual_function:
      alpha: 5.5
      beta: 4.5
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        PDE5 pivotal RCTs show large placebo-adjusted IIEF deltas, and continued
        revealed use signals response; transport still shrinks toward a milder-severity
        user. Beta(5.5, 4.5) -> mean 55%.
      calibration_sources:
        - Goldstein 1998 (sildenafil RCT)
    mood_stress:
      alpha: 2.0
      beta: 7.0
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        Commercial adaptogen/mood trials are small, unregistered, and shrink in better
        designs; placebo share of subjective mood gains is large.
        Beta(2.0, 7.0) -> mean 22%.
      calibration_sources:
        - Speers 2021 (ashwagandha review)
        - Kirsch 2008 (placebo share, subjective mood endpoints)
    pain_joint:
      alpha: 2.5
      beta: 6.0
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        OA/joint trials show very large placebo responses; GAIT found glucosamine no better
        than placebo on its primary endpoint. Beta(2.5, 6.0) -> mean 29%.
      calibration_sources:
        - Clegg 2006 (GAIT)
    gi_symptom:
      alpha: 2.8
      beta: 5.2
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        Fiber/probiotic RCTs exist but endpoints are subjective and
        strain/formulation-specific effects transport poorly.
        Beta(2.8, 5.2) -> mean 35%.
      calibration_sources:
        - Ford 2018 (probiotics in IBS, meta-analysis)
    cognitive:
      alpha: 1.8
      beta: 7.2
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        Cognitive-supplement effects in healthy adults rarely replicate outside industry
        trials; expectancy effects dominate. Beta(1.8, 7.2) -> mean 20%.
      calibration_sources:
        - Docherty 2023 (lion's mane pilot, n=41)
    hair_skin:
      alpha: 4.0
      beta: 4.0
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        Finasteride hair outcomes are objective (photographic RCTs), but mapping appearance
        change to utility leans on proxy TTO weights. Beta(4.0, 4.0) -> mean 50%.
      calibration_sources:
        - Kaufman 1998 (finasteride RCT)
    fitness_function:
      alpha: 5.0
      beta: 3.0
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        CRF/strength gains from structured training are objective and RCT-backed; the
        shrink covers the indirect CRF-to-utility mapping, not the training response.
        Beta(5.0, 3.0) -> mean 63%.
      calibration_sources:
        - Milanovic 2015 (HIIT VO2max meta-analysis)
    metabolic_symptom:
      alpha: 3.0
      beta: 5.0
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        Glycemic/metabolic symptom claims ride on objective markers but subjective wellbeing
        mapping is indirect. Beta(3.0, 5.0) -> mean 38%.
      calibration_sources:
        - SELECT 2023 (semaglutide, hard endpoints)
    general_vitality:
      alpha: 1.5
      beta: 8.5
      source: "Transport prior: fraction of a published/claimed effect expected to survive placebo stripping plus population transport."
      rationale: >-
        Diffuse 'energy/vitality/longevity support' claims have the weakest
        evidence-to-feeling mapping. Beta(1.5, 8.5) -> mean 15%.
      calibration_sources: []

  authored_residual_optimism:
    alpha: 6.0
    beta: 2.0
    source: >-
      Residual-optimism prior for authored_shaded anchors: the authored mean already embeds
      a personal-severity judgment, so only residual author optimism is stripped, not the full placebo share.
    rationale: >-
      Authored qol_annual values were hand-shaded for personal severity;
      this strips residual optimism only. Beta(6, 2) -> mean 75%.
    calibration_sources: []

