name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # uv resolves Python from python/.python-version (3.13 — a mature
      # prebuilt; pinning 3.14 in setup-uv hung the runner for ~19 min).
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        # --all-extras pulls pytest/pytest-xdist/pandas (declared as extras);
        # uv re-syncs on each `uv run`, so extras must be requested here.
        # -n auto parallelizes the slow subprocess-spawning web tests.
        run: uv run --all-extras pytest -q -n auto

      # ~1,000 pre-existing ruff findings exist (line length, imports, etc.).
      # Surface them without gating the build.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: uv run --all-extras ruff check

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test
