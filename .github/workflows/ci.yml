name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python (uv-managed)
        run: uv python install
      - name: Run tests
        # --all-extras ensures pytest/pandas/pyarrow (declared as optional
        # extras) are present in the run environment; uv re-syncs on each
        # `uv run`, so the extras must be requested here, not only on a prior sync.
        # -n auto parallelizes across cores (the suite has slow subprocess tests).
        run: uv run --all-extras pytest -q -n auto
      - name: Lint (non-blocking)
        run: uv run --all-extras ruff check
        continue-on-error: true

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun run test
